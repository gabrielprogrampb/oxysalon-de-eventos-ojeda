name: CI

# Se ejecuta en cada push y en cada pull request.
# Si esto falla, el despliegue no debe publicarse: Vercel respeta el estado del build,
# pero el chequeo real de calidad es este.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones antiguas del mismo commit para no gastar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Revisar lint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm run test

      - name: Construir el sitio de producción
        run: npm run build
        env:
          # Claves públicas de Supabase. Si no están configuradas en el repositorio,
          # el build se genera igualmente en modo demostración.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Comprobar que el build tiene contenido
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Build generado:"
          du -sh dist

  e2e:
    name: Pruebas end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Construir el sitio (modo demostración, sin credenciales)
        run: npm run build:e2e

      - name: Ejecutar pruebas end-to-end
        run: npx playwright test
        env:
          CI: 'true'

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
